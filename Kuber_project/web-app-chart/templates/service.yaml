{{- range $siteName, $siteConfig := .Values.sites }}
{{- if $siteConfig.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: service-{{ $siteName }}
  labels:
    app: nginx-{{ $siteName }}
spec:

  selector:
    app: nginx-{{ $siteName }}
  ports:
    - port: 80
      targetPort: 80
      name: http
    - port: 9113
      targetPort: 9113
      name: metrics
{{- end }}
{{- end }}
